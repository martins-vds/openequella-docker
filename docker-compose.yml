services:
  equella-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: equella_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: openequella_repo
    volumes:
      - postgres_repository_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equella_admin -d openequella_repo"]
      interval: 5s
      timeout: 5s
      retries: 12

  openequella:
    image: openequella-local:2026.1.1
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      EQ_HTTP_PORT: "8080"
      EQ_ADMIN_URL: http://localhost:8082/admin/
      EQ_HIBERNATE_CONNECTION_URL: jdbc:postgresql://equella-db:5432/openequella_repo
      EQ_HIBERNATE_CONNECTION_USERNAME: equella_admin
      EQ_HIBERNATE_CONNECTION_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - openequella_filestore:/home/equella/equella/filestore
      - openequella_freetext:/home/equella/equella/freetext
      - openequella_logs:/home/equella/equella/logs
    depends_on:
      equella-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080/admin/"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 10

volumes:
  postgres_repository_data:
  openequella_filestore:
  openequella_freetext:
  openequella_logs:
